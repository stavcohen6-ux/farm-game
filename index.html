<body>
  <div class="grove-sky" aria-hidden="true"></div>
  <div
    id="opening-screen"
    class="opening-screen"
    role="dialog"
    aria-modal="true"
    aria-labelledby="opening-title"
  >
    <div class="opening-screen__scene" aria-hidden="true">
      <img
        class="opening-screen__scene-img"
        src="assets/opening/opening_journey.png"
        alt=""
        draggable="false"
      />
    </div>
    <div class="opening-screen__veil" aria-hidden="true"></div>
    <h1 id="opening-title" class="opening-screen__title">
      <img
        class="opening-screen__title-img"
        src="assets/opening/opening_title.png?v=mock-a"
        alt="Harmony Grove"
        draggable="false"
      />
    </h1>
    <button
      type="button"
      id="opening-play"
      class="opening-screen__play"
      disabled
      aria-busy="true"
      aria-label="Play"
    >
      <img
        class="opening-screen__play-img"
        src="assets/opening/opening_play.png?v=alpha3"
        alt=""
        draggable="false"
      />
    </button>
  </div>
  <div id="app" class="app--gated">
    <div id="grove-stage" class="grove-stage">
      <div id="dragon-temple" class="dragon-temple"></div>
      <div id="farm-board" class="farm-board">
        <div id="farm-grid" class="farm-grid"></div>
        <div id="shrine-frog" class="shrine shrine--top-left"></div>
        <div id="shrine-monkey" class="shrine shrine--top-right"></div>
        <div id="shrine-fox" class="shrine shrine--bottom-left"></div>
        <div id="shrine-tiger" class="shrine shrine--bottom-right"></div>
      </div>
    </div>
    <div id="info-band" class="info-band">
      <button
        type="button"
        id="game-text"
        class="game-text"
        aria-label="Field Notes"
      ></button>
    </div>
  </div>
  <script type="module" src="src/main.js?v=b5a961b17835"></script>
