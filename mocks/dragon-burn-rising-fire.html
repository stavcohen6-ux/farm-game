<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Resolve assets/ relative to project root (not /mocks/). -->
  <base href="../" />
  <title>Dragon burn — rising fire mockup</title>
  <style>
    :root {
      --ink: #3a3428;
      --tile: 4.5rem;
      --plot-gap: 0.55rem;
      --frame-pad: 0.7rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 30%, rgba(232, 200, 120, 0.18), transparent 55%),
        linear-gradient(165deg, #ebe3d4 0%, #d8cfc0 45%, #cbbfad 100%);
    }

    .stage {
      width: min(420px, 92vw);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
      font-weight: 700;
    }

    p {
      margin: 0 0 1.1rem;
      font-size: 0.85rem;
      opacity: 0.75;
      line-height: 1.35;
    }

    .board {
      padding: var(--frame-pad);
      border-radius: 14px;
      border: 3px solid #5a5040;
      background: #8a8270 url("assets/icons/farm_frame.png") center / 100% 100% no-repeat;
      box-shadow:
        inset 0 2px 0 rgba(255, 236, 180, 0.35),
        inset 0 -6px 14px rgba(40, 32, 18, 0.22),
        0 4px 0 #4a4030,
        0 10px 20px rgba(42, 36, 22, 0.18),
        0 0 18px rgba(196, 106, 46, 0.35);
    }

    .slots {
      display: flex;
      justify-content: center;
      gap: var(--plot-gap);
    }

    .slot {
      position: relative;
      width: var(--tile);
      height: var(--tile);
      border-radius: 10px;
      display: grid;
      place-items: center;
      overflow: visible;
      border: 1.5px solid rgba(212, 192, 160, 0.85);
      background: rgba(247, 244, 236, 0.92);
      box-shadow:
        inset 0 3px 6px rgba(40, 32, 18, 0.18),
        0 2px 0 rgba(60, 52, 40, 0.25);
    }

    .edge {
      position: absolute;
      inset: -3px;
      border-radius: inherit;
      padding: 3px;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask-composite: exclude;
    }

    .edge-spin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 160%;
      height: 160%;
      translate: -50% -50%;
      background: conic-gradient(
        transparent 0deg,
        transparent 150deg,
        rgba(138, 85, 56, 0.2) 175deg,
        rgba(168, 111, 74, 0.65) 205deg,
        #c46a2e 230deg,
        #b87838 255deg,
        #e8c878 280deg,
        #c46a2e 305deg,
        #a86f4a 330deg,
        rgba(138, 85, 56, 0.35) 348deg,
        transparent 360deg
      );
      animation: edge 0.9s linear infinite;
    }

    .edge-spin.glow {
      filter: blur(5px);
      opacity: 0.9;
    }

    @keyframes edge {
      to { transform: rotate(360deg); }
    }

    .crop {
      position: relative;
      z-index: 1;
      width: 2.85em;
      height: 2.85em;
      animation: char 3.6s ease-in forwards;
    }

    .crop img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes char {
      0% { filter: none; opacity: 1; transform: scale(1); }
      45% {
        filter: sepia(0.5) brightness(0.75);
        opacity: 0.85;
        transform: scale(0.96);
      }
      100% {
        filter: sepia(0.7) brightness(0.45);
        opacity: 0;
        transform: scale(0.82);
      }
    }

    .flames {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
    }

    .flame {
      position: absolute;
      bottom: 0;
      opacity: 0;
      filter: drop-shadow(0 1px 3px rgba(180, 60, 10, 0.45));
      animation: rise 1200ms ease-out infinite;
    }

    .flame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes rise {
      0% { transform: translate(0, 6px) scale(0.75); opacity: 0; }
      16% { opacity: 1; }
      100% { transform: translate(var(--dx, 0), -2.15em) scale(1.05); opacity: 0; }
    }

    .note {
      margin-top: 1rem;
      font-size: 0.78rem;
      opacity: 0.65;
    }

    button {
      margin-top: 0.85rem;
      font: inherit;
      font-size: 0.85rem;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      border: 1.5px solid #5a5040;
      background: #f7f2e8;
      color: var(--ink);
      cursor: pointer;
    }

    button:hover { background: #fff8ec; }
  </style>
</head>
<body>
  <div class="stage">
    <h1>Rising fire.png burn</h1>
    <p>Mock only — edges kept; inner wash/dots replaced with clipped rising flames.</p>
    <div class="board" id="board"></div>
    <button type="button" id="replay">Replay burn</button>
    <p class="note">~3.6s loop · 4 flames / slot · larger icons · crop chars &amp; fades</p>
  </div>
  <script>
    const CROPS = [
      "assets/icons/wheat.png",
      "assets/icons/blueberry.png",
      "assets/icons/wheat.png",
      "assets/icons/blueberry.png",
    ];
    // ~tile-scale flames (tile ≈ 72px); sizes a bit larger than first mock
    const FLAME_LAYOUT = [
      { left: "28%", dx: "-7px", delay: "0ms", dur: "1150ms", size: 52 },
      { left: "50%", dx: "5px", delay: "180ms", dur: "1200ms", size: 60 },
      { left: "72%", dx: "9px", delay: "320ms", dur: "1100ms", size: 50 },
      { left: "40%", dx: "-11px", delay: "520ms", dur: "1250ms", size: 48 },
    ];

    function build() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      const row = document.createElement("div");
      row.className = "slots";

      CROPS.forEach((src, i) => {
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.innerHTML = `
          <span class="edge" aria-hidden="true">
            <span class="edge-spin glow"></span>
            <span class="edge-spin"></span>
          </span>
          <span class="crop"><img src="${src}" alt="" /></span>
          <span class="flames" aria-hidden="true"></span>
        `;
        const flames = slot.querySelector(".flames");
        FLAME_LAYOUT.forEach((f) => {
          const el = document.createElement("span");
          el.className = "flame";
          el.style.left = f.left;
          el.style.setProperty("--dx", f.dx);
          el.style.animationDuration = f.dur;
          el.style.animationDelay = `calc(${f.delay} + ${i * 70}ms)`;
          el.style.width = el.style.height = f.size + "px";
          el.style.marginLeft = -f.size / 2 + "px";
          el.innerHTML =
            '<img src="mocks/dragon-burn-fire-cutout.png" alt="" />';
          flames.appendChild(el);
        });
        const crop = slot.querySelector(".crop");
        crop.style.animation = "none";
        void crop.offsetWidth;
        crop.style.animation = "";
        row.appendChild(slot);
      });

      board.appendChild(row);
    }

    document.getElementById("replay").onclick = build;
    build();
  </script>
</body>
</html>
